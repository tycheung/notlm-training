name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notlm-training
        uses: actions/checkout@v4
        with:
          path: notlm-training

      - name: Checkout sibling notlm
        uses: actions/checkout@v4
        with:
          repository: tycheung/notlm
          path: notlm
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            notlm/package-lock.json
            notlm-training/package-lock.json

      - name: Build operating runtime deps (file links)
        working-directory: notlm
        run: |
          npm ci
          npm run build -w @notlm/core -w @notlm/schema -w @notlm/ranker

      - name: Training CI
        working-directory: notlm-training
        run: |
          npm ci
          npm run ci
